name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kalakriti_user
          POSTGRES_PASSWORD: kalakriti_pass
          POSTGRES_DB: kalakriti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalakriti_user"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://kalakriti_user:kalakriti_pass@localhost:5432/kalakriti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration + regression tests
        run: python -m pytest -v --cov=app --cov-report=term-missing

  mutation-tests:
    name: Mutation tests (mutmut)
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mutmut run || true
      - name: Fail if more than one mutant survives
        run: |
          mutmut results | tee mutmut-results.txt
          survived=$(mutmut results | awk '/Survived/ {gsub(/[^0-9]/,"",$0); print; exit}')
          echo "Surviving mutants: ${survived:-0}"
          test "${survived:-0}" -le 1

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install before the stack starts: the frontend container bind-mounts
      # ./frontend and creates root-owned files there, which npm ci cannot remove.
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build and start the full stack
        run: docker compose up --build -d
      - name: Wait for the API
        run: timeout 90 bash -c 'until curl -sf localhost:8000/health; do sleep 2; done'
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt && docker compose down -v
